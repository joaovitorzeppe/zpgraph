<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Basic · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Basic timeseries</h1>
  <p class="lede">Drag to zoom, double-click to reset. Roller averages consecutive points.</p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import Zpgraph from 'zpgraph';
    import { makeSeries } from './helpers.js';

    new Zpgraph(document.getElementById('chart'), makeSeries({ points: 90, series: 2 }), {
      labels: ['Date', 'Alpha', 'Beta'],
      tooltip: { show: 'always' },
      title: 'Sample timeseries',
      ylabel: 'Value',
      animatedZooms: true,
      showRoller: true,
      rollPeriod: 1,
      colors: ['#1b6b93', '#c45c26'],
    });
  </script>
</body>

</html>
