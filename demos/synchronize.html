<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Synchronize · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Synchronize</h1>
  <p class="lede">
    Zoom or select on either chart; the other follows via
    <code>zpgraph/extras/synchronizer</code>.
  </p>
  <div class="row">
    <div id="a" class="chart sm" style="width: min(470px, 100%)"></div>
    <div id="b" class="chart sm" style="width: min(470px, 100%)"></div>
  </div>
  <script type="module">
    import Zpgraph from 'zpgraph';
    import { synchronize } from '../dist/extras/synchronizer.js';
    import { makeSeries } from './helpers.js';

    const shared = makeSeries({ points: 100, series: 2, seed: 11 });
    const opts = {
      labels: ['Date', 'A', 'B'],
      tooltip: { show: 'always' },
      colors: ['#1b6b93', '#c45c26'],
      animatedZooms: true,
    };

    const g1 = new Zpgraph(document.getElementById('a'), shared, {
      ...opts,
      title: 'Chart 1',
    });
    const g2 = new Zpgraph(
      document.getElementById('b'),
      makeSeries({ points: 100, series: 2, seed: 19 }),
      { ...opts, title: 'Chart 2', colors: ['#2a9d8f', '#6d597a'] },
    );

    synchronize(g1, g2, { selection: true, zoom: true });
  </script>
</body>

</html>
