<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locale · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Locale</h1>
  <p class="lede">
    Named packs <code>packs.pt</code> / <code>en</code> / <code>es</code> plus
    toolbar labels. Extra: <code>zpgraph/extras/locale</code>.
  </p>
  <p>
    <button type="button" data-pack="pt">pt</button>
    <button type="button" data-pack="en">en</button>
    <button type="button" data-pack="es">es</button>
  </p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import Zpgraph from 'zpgraph';
    import { applyLocale, packs } from '../dist/extras/locale.js';
    import { makeSeries } from './helpers.js';

    const g = new Zpgraph(
      document.getElementById('chart'),
      makeSeries({ points: 120, series: 1, seed: 2 }),
      {
        labels: ['Data', 'Valor'],
        tooltip: { show: 'always' },
        colors: ['#1b6b93'],
        animatedZooms: true,
        toolbar: true,
        axes: {
          x: {
            axisLabelFormatter: (d) => {
              const locale = g.locale_ || packs.pt;
              const dt = d instanceof Date ? d : new Date(d);
              const m = locale.months?.[dt.getUTCMonth()] ?? dt.getUTCMonth();
              return `${dt.getUTCDate()} ${m}`;
            },
          },
          y: {
            valueFormatter: (y) => {
              const locale = g.locale_ || packs.pt;
              const s = String(Math.round(y * 100) / 100);
              return locale.decimalPoint === ',' ? s.replace('.', ',') : s;
            },
          },
        },
      },
    );

    applyLocale(g, packs.pt);

    document.querySelectorAll('[data-pack]').forEach((btn) => {
      btn.addEventListener('click', () => {
        applyLocale(g, packs[btn.dataset.pack]);
        g.updateOptions({});
      });
    });
  </script>
</body>

</html>
