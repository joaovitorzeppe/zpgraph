<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Error bars · Zgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Error bars</h1>
  <p class="lede">Each point is <code>[value, stddev]</code> with <code>errorBars: true</code>.</p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import Zgraph from 'zpgraph';
    import { makeErrorBars } from './helpers.js';

    new Zgraph(document.getElementById('chart'), makeErrorBars(55), {
      labels: ['Date', 'Signal'],
      errorBars: true,
      legend: 'always',
      drawPoints: true,
      colors: ['#1b6b93'],
      ylabel: 'Amplitude',
      animatedZooms: true,
      sigma: 2,
    });
  </script>
</body>

</html>
