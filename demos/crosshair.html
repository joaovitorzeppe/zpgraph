<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Crosshair · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Crosshair</h1>
  <p class="lede">
    Extra plugin draws horizontal and vertical lines through the selected
    point.
  </p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import { Zpgraph } from 'zpgraph';
    import Crosshair from '../dist/extras/crosshair.js';
    import { makeSeries } from './helpers.js';

    new Zpgraph(document.getElementById('chart'), makeSeries({ points: 80, series: 2 }), {
      labels: ['Date', 'A', 'B'],
      tooltip: { show: 'always' },
      colors: ['#1b6b93', '#c45c26'],
      animatedZooms: true,
      plugins: [
        new Crosshair({ direction: 'both', strokeStyle: 'rgba(13, 27, 42, 0.35)' }),
      ],
    });
  </script>
</body>

</html>
