<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Stacked fill · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Stacked + fill</h1>
  <p class="lede">Positive contributions stacked into an area chart.</p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import Zpgraph from 'zpgraph';
    import { utcDay, dayMs } from './helpers.js';

    const start = utcDay(2024, 6, 1);
    const data = [];
    for (let i = 0; i < 50; i++) {
      data.push([
        new Date(start + i * dayMs),
        8 + Math.abs(Math.sin(i / 6)) * 6,
        5 + Math.abs(Math.cos(i / 5)) * 4,
        3 + Math.abs(Math.sin(i / 4 + 1)) * 3,
      ]);
    }

    new Zpgraph(document.getElementById('chart'), data, {
      labels: ['Date', 'Base', 'Mid', 'Top'],
      stackedGraph: true,
      fillGraph: true,
      tooltip: { show: 'always' },
      colors: ['#1b6b93', '#2a9d8f', '#e9c46a'],
      ylabel: 'Units',
      animatedZooms: true,
    });
  </script>
</body>

</html>
