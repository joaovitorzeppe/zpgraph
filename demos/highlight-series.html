<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Highlight series · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Highlight series</h1>
  <p class="lede">Hover a series to thicken it and fade the background.</p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import Zpgraph from 'zpgraph';
    import { makeSeries } from './helpers.js';

    new Zpgraph(document.getElementById('chart'), makeSeries({ points: 100, series: 4, seed: 8 }), {
      labels: ['Date', 'North', 'East', 'South', 'West'],
      tooltip: { show: 'always' },
      colors: ['#1b6b93', '#c45c26', '#2a9d8f', '#6d597a'],
      highlightSeriesOpts: {
        strokeWidth: 3,
        strokeBorderWidth: 1,
        highlightCircleSize: 5,
      },
      highlightSeriesBackgroundAlpha: 0.35,
      animatedZooms: true,
    });
  </script>
</body>

</html>
