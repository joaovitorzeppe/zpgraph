<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Annotations · Zgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Annotations</h1>
  <p class="lede">Markers attached to series points. Click a point to add one.</p>
  <div id="chart" class="chart"></div>
  <p class="note" id="log"></p>
  <script type="module">
    import Zgraph from 'zpgraph';
    import { makeSeries, utcDay, dayMs } from './helpers.js';

    const data = makeSeries({ points: 40, series: 2, seed: 3 });
    const start = utcDay(2024, 0, 1);

    const g = new Zgraph(document.getElementById('chart'), data, {
      labels: ['Date', 'Parabola', 'Sine'],
      legend: 'always',
      animatedZooms: true,
      colors: ['#1b6b93', '#c45c26'],
      pointClickCallback: (e, point) => {
        const anns = g.annotations().slice();
        anns.push({
          series: point.name,
          x: point.xval,
          shortText: String(anns.length + 1),
          text: `${point.name} @ ${new Date(point.xval).toISOString().slice(0, 10)}`,
        });
        g.setAnnotations(anns);
        document.getElementById('log').textContent =
          `Annotation on ${point.name} (${anns.length} total)`;
      },
    });

    g.setAnnotations([
      {
        series: 'Parabola',
        x: start + 10 * dayMs,
        shortText: 'A',
        text: 'Early peak',
      },
      {
        series: 'Sine',
        x: start + 25 * dayMs,
        shortText: 'B',
        text: 'Mid trough',
        attachAtBottom: true,
      },
    ]);
  </script>
</body>

</html>
