<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Measure · Zpgraph</title>
  <link rel="stylesheet" href="../dist/style.css" />
  <link rel="stylesheet" href="common.css" />
  <script type="importmap">
      { "imports": { "zpgraph": "../dist/index.js" } }
    </script>
</head>

<body>
  <nav class="crumb"><a href="index.html">← Demos</a></nav>
  <h1>Measure</h1>
  <p class="lede">
    Click twice to measure Δx / Δy. Third click resets. Extra:
    <code>zpgraph/extras/measure</code>.
  </p>
  <p><button type="button" id="clear">Clear</button> <span id="out"></span></p>
  <div id="chart" class="chart"></div>
  <script type="module">
    import { Zpgraph } from 'zpgraph';
    import Measure from '../dist/extras/measure.js';
    import { makeSeries } from './helpers.js';

    const out = document.getElementById('out');
    const measure = new Measure({
      onMeasure: (r) => {
        out.textContent = `Δx=${Math.round(r.deltaX)} Δy=${r.deltaY.toFixed(2)}`;
      },
    });

    new Zpgraph(document.getElementById('chart'), makeSeries({ points: 90, series: 1 }), {
      labels: ['Date', 'Temp'],
      tooltip: { show: 'always' },
      colors: ['#1b6b93'],
      animatedZooms: true,
      plugins: [measure],
    });

    document.getElementById('clear').onclick = () => {
      measure.clear();
      out.textContent = '';
    };
  </script>
</body>

</html>
